# Al publicar una release en GitHub, arma caminos-locales-plataforma.zip (con la carpeta caminos-locales-plataforma/)
# y lo adjunta a la release. Ese zip es el que descargan los sitios al actualizar.
name: Zip de la release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que la versión del plugin coincida con la etiqueta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CABECERA=$(grep -m1 -E '^\s*\*\s*Version:' caminos-locales-plataforma.php | sed -E 's/.*Version:\s*//; s/\s*$//')
          CONSTANTE=$(grep -m1 "CLP_VERSION'," caminos-locales-plataforma.php | sed -E "s/.*'CLP_VERSION',\s*'([^']+)'.*/\1/")
          echo "Etiqueta: $TAG · Cabecera: $CABECERA · CLP_VERSION: $CONSTANTE"
          if [ "$TAG" != "$CABECERA" ] || [ "$TAG" != "$CONSTANTE" ]; then
            echo "::error::La etiqueta ($TAG) no coincide con Version ($CABECERA) o CLP_VERSION ($CONSTANTE) en caminos-locales-plataforma.php"
            exit 1
          fi

      - name: Armar el zip
        run: |
          mkdir -p build/caminos-locales-plataforma
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'README.md' ./ build/caminos-locales-plataforma/
          cd build && zip -rq caminos-locales-plataforma.zip caminos-locales-plataforma

      - name: Adjuntar el zip a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/caminos-locales-plataforma.zip --clobber
